<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PassiTech | Acesso aos downloads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#20C997;--b:#007AFF;--line:rgba(255,255,255,.1);--mut:rgba(255,255,255,.62);--err:#FF6B6B}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;color:#fff;background:#07070c;min-height:100dvh;display:grid;place-items:center;padding:24px;overflow-x:hidden;perspective:1200px}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:-1;animation:float 16s ease-in-out infinite}
.b1{width:420px;height:420px;background:var(--g);top:-120px;left:-100px}
.b2{width:480px;height:480px;background:var(--b);bottom:-160px;right:-120px;animation-delay:-6s}
.b3{width:300px;height:300px;background:#8134AF;top:40%;left:55%;opacity:.28;animation-delay:-11s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-40px) scale(1.12)}66%{transform:translate(-40px,50px) scale(.94)}}
.grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.18;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 70%);mask-image:radial-gradient(circle at 50% 40%,#000,transparent 70%)}
.card{position:relative;width:100%;max-width:540px;border-radius:36px;padding:38px 32px 26px;background:rgba(18,18,26,.74);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transition:transform .15s ease-out;animation:enter .8s cubic-bezier(.16,1,.3,1)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0,var(--g) 15%,transparent 30%,var(--b) 60%,transparent 75%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.logo{display:flex;justify-content:center;margin-bottom:16px}
#logo{width:120px;max-height:78px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(32,201,151,.45))}
.fb{font-size:1.5rem;font-weight:800}
h1{text-align:center;font-size:1.65rem;font-weight:800;letter-spacing:-.6px;line-height:1.2;margin-bottom:8px;background:linear-gradient(120deg,#fff 20%,var(--g),var(--b),#fff 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.sub{text-align:center;color:var(--mut);font-size:.92rem;line-height:1.55;margin:0 auto 20px;max-width:400px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--b));transition:width .6s cubic-bezier(.16,1,.3,1)}
.cnt{font-size:.78rem;color:var(--mut);text-align:right;margin-bottom:16px}
.ch{position:relative;display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.03);margin-bottom:12px;overflow:hidden;transition:border-color .4s,background .4s}
.ch.wait{border-color:rgba(0,122,255,.6)}
.ch.chk{border-color:rgba(32,201,151,.5)}
.ch.ok{border-color:rgba(32,201,151,.6);background:rgba(32,201,151,.09)}
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(32,201,151,.22),rgba(0,122,255,.22));flex:none}
.ic svg{width:23px;height:23px;fill:var(--g)}
.t{flex:1;min-width:0}.t b{display:block;font-size:.97rem}.t small{display:block;color:var(--mut);font-size:.79rem;margin-top:2px;line-height:1.35}
.ch.ok .t small{color:var(--g)}
.act{flex:none}
button,.btn{font:inherit;cursor:pointer;border:0;color:#fff;border-radius:60px;padding:11px 18px;font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .2s,opacity .2s}
button:hover:not(:disabled){transform:translateY(-2px)}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px}
.s1{background:linear-gradient(135deg,var(--g),#0f8f6c)}.s2{background:linear-gradient(135deg,var(--b),#0051b3)}
.chk .act button{background:rgba(255,255,255,.1);border:1px solid var(--line)}
.spin{width:15px;height:15px;border:2.5px solid var(--line);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.tick{width:34px;height:34px}.tick circle{fill:var(--g)}.tick path{stroke:#052019;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pb{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--g),var(--b));box-shadow:0 0 12px rgba(32,201,151,.6)}
.dl{width:100%;padding:17px;font-size:1rem;border-radius:60px;background:linear-gradient(135deg,var(--g),var(--b));box-shadow:0 14px 30px -8px rgba(32,201,151,.5);margin-top:4px}
.dl:disabled{background:rgba(255,255,255,.07);box-shadow:none;color:var(--mut)}
.dl.ready{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 14px 40px -4px rgba(0,122,255,.7)}}
.msg{min-height:20px;text-align:center;font-size:.82rem;margin-top:12px;color:var(--mut)}.msg.err{color:var(--err)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:.78rem;color:var(--mut)}
.ig{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-weight:600;padding:8px 14px;border-radius:50px;background:linear-gradient(135deg,#F58529,#DD2A7B 55%,#8134AF);transition:transform .2s}
.ig:hover{transform:translateY(-2px)}
.ig svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cf{position:fixed;inset:0;pointer-events:none;z-index:99}.cf span{position:absolute;top:-5vh;width:9px;height:14px;opacity:0;animation:fall 3s ease-out forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(105vh) rotate(720deg)}}
@media(max-width:520px){.card{padding:28px 16px 22px;border-radius:28px}h1{font-size:1.38rem}.ch{flex-wrap:wrap}.act{width:100%}.act button{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div>

<main class="card" id="card">
  <div class="logo"><img id="logo" src="logo.png" alt="PassiTech"><span class="fb" id="fb" hidden>PassiTech</span></div>
  <h1>Libere seu download gratuito</h1>
  <p class="sub">Inscreva-se nos dois canais do YouTube para desbloquear o acesso. Leva menos de um minuto.</p>

  <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0"><i id="fill"></i></div>
  <div class="cnt" id="cnt" aria-live="polite">0 de 2 inscrições confirmadas</div>

  <div class="ch" id="c1" data-key="passitech" data-url="https://www.youtube.com/@PASSITECH?sub_confirmation=1">
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M19.6 3.2c-3.6-.25-11.6-.25-15.2 0C.5 3.5 0 5.8 0 12s.5 8.5 4.4 8.8c3.6.25 11.6.25 15.2 0 3.9-.27 4.4-2.6 4.4-8.8s-.5-8.5-4.4-8.8zM9 16V8l8 4-8 4z"/></svg></div>
    <div class="t"><b>Canal PassiTech</b><small>Toque em inscrever-se</small></div>
    <div class="act"><button class="s1" type="button">Inscrever-se</button></div><div class="pb"></div>
  </div>

  <div class="ch" id="c2" data-key="rjotafn" data-url="https://www.youtube.com/@RJOTAFN?sub_confirmation=1">
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M19.6 3.2c-3.6-.25-11.6-.25-15.2 0C.5 3.5 0 5.8 0 12s.5 8.5 4.4 8.8c3.6.25 11.6.25 15.2 0 3.9-.27 4.4-2.6 4.4-8.8s-.5-8.5-4.4-8.8zM9 16V8l8 4-8 4z"/></svg></div>
    <div class="t"><b>Canal RJOTAFN</b><small>Toque em inscrever-se</small></div>
    <div class="act"><button class="s2" type="button">Inscrever-se</button></div><div class="pb"></div>
  </div>

  <button class="dl" id="dl" type="button" disabled>🔒 Download bloqueado</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <div class="foot">
    <a class="ig" href="https://www.instagram.com/rjotablog/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg>@rjotablog</a>
    <span>Suporte e consultoria remota</span>
  </div>
</main>
<div class="cf" id="cf" aria-hidden="true"></div>

<script>
(function(){
  var FALLBACK="https://plataforma.passitech.com/downloads", MIN_AWAY=8000, KEY="passitech_v3";
  var $=function(i){return document.getElementById(i)}, msg=$("msg"), dl=$("dl");
  var TICK='<svg class="tick" viewBox="0 0 34 34"><circle cx="17" cy="17" r="17"/><path d="M9.5 17.5l5 5L24.5 11.5"/></svg>';
  var PHASES=["Confirmando inscrição…","Validando…","Quase pronto…"];
  var saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
  function say(t,e){msg.textContent=t||"";msg.className="msg"+(e?" err":"")}
  $("logo").addEventListener("error",function(){this.hidden=true;$("fb").hidden=false});

  var chans=[$("c1"),$("c2")].map(function(el){
    return{el:el,key:el.dataset.key,url:el.dataset.url,btn:el.querySelector("button"),sm:el.querySelector("small"),act:el.querySelector(".act"),pb:el.querySelector(".pb"),
      mode:"idle",away:0,leftAt:null,idleBtn:el.querySelector("button").className}
  });

  function counts(){
    var n=chans.filter(function(c){return saved[c.key]}).length;
    $("fill").style.width=(n*50)+"%";$("bar").setAttribute("aria-valuenow",n);
    $("cnt").textContent=n+" de 2 inscrições confirmadas";
    if(n===2){dl.disabled=false;dl.classList.add("ready");dl.textContent="Baixar agora"}
  }
  function setOk(c){
    c.mode="ok";c.el.className="ch ok";c.sm.textContent="Inscrição confirmada";c.act.innerHTML=TICK;c.pb.style.width="0";counts();
  }
  function reset(c,m){
    c.mode="idle";c.el.className="ch";c.sm.textContent="Toque em inscrever-se";c.leftAt=null;c.away=0;
    c.btn.disabled=false;c.btn.className=c.idleBtn;c.btn.textContent="Inscrever-se";c.pb.style.width="0";if(m)say(m,true);
  }
  function countdown(c){
    c.mode="chk";c.el.className="ch chk";c.btn.disabled=true;say("");
    window.open(c.url,"_blank","noopener");
    var n=15;c.btn.innerHTML='<span class="spin"></span>Verificando <b class="cd">15s</b>';
    c.sm.textContent="Confirmando sua inscrição…";
    c.pb.style.transition="none";c.pb.style.width="0";void c.pb.offsetWidth;
    c.pb.style.transition="width 15s linear";c.pb.style.width="100%";
    var iv=setInterval(function(){
      n--;var cd=c.btn.querySelector(".cd");if(cd)cd.textContent=n+"s";
      if(n<=0){clearInterval(iv);c.pb.style.transition="none";saved[c.key]=true;persist();setOk(c);
        if(saved.passitech&&saved.rjotafn){say("Tudo certo! Seu download foi liberado.");confetti()}}
    },1000);
  }

  chans.forEach(function(c){
    if(saved[c.key]){setOk(c)}
    c.btn.addEventListener("click",function(){
      if(c.mode==="idle"){
        // 1º clique: abre o canal e mostra o aviso
        window.open(c.url,"_blank","noopener");
        c.mode="retry";c.el.className="ch wait";
        c.sm.textContent="Não encontramos sua inscrição.";
        c.btn.textContent="Verificar novamente";
        say("Não encontramos sua inscrição. Abra o canal e toque em “Inscrever-se” no YouTube.",true);
      }else if(c.mode==="retry"){
        // 2º clique: abre o canal de novo e inicia a contagem de 15s
        countdown(c);
      }
    });
  });

  function target(){
    var r=new URLSearchParams(location.search).get("link");if(!r)return FALLBACK;
    try{var u=new URL(r);return u.protocol==="https:"?u.href:FALLBACK}catch(e){return FALLBACK}
  }
  dl.addEventListener("click",function(){
    if(!(saved.passitech&&saved.rjotafn))return;
    dl.disabled=true;dl.classList.remove("ready");dl.textContent="Redirecionando…";confetti();
    setTimeout(function(){location.href=target()},1400);
  });

  function confetti(){var c=$("cf"),k=["#20C997","#007AFF","#FFD700","#FF6B6B","#9B59B6","#FF8C42"];
    for(var i=0;i<110;i++){var p=document.createElement("span");p.style.left=Math.random()*100+"%";p.style.background=k[i%6];p.style.animationDelay=Math.random()+"s";p.style.animationDuration=2+Math.random()*2+"s";c.appendChild(p)}
    setTimeout(function(){c.innerHTML=""},5500)}

  counts();

  // leve efeito 3D com o mouse
  var card=$("card");
  if(matchMedia("(hover:hover)").matches&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
    document.addEventListener("mousemove",function(e){var x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;card.style.transform="rotateY("+x*5+"deg) rotateX("+-y*5+"deg)"});
  }
})();
</script>
</body>
</html>
